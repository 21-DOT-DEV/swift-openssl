    - "**/sm4/**"
    - "**/aria/**"
    - "**/evp/legacy_md2.c"
    - "**/evp/legacy_md4.c"
    - "**/evp/legacy_mdc2.c"
    - "**/evp/legacy_wp.c"
    - "**/evp/e_seed.c"
