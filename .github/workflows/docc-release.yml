name: DocC Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docc-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  docc:
    name: Build DocC Archive
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write  # for gh release upload
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # ensure git tag -d sees the published tag

      - name: Enable development dependencies
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: git tag -d "$TAG_NAME" 2>/dev/null || true

      - name: Verify Swift toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Build DocC Archive
        run: |
          mkdir -p docs
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target OpenSSL \
            --analyze \
            --warnings-as-errors \
            --output-path ./docs/OpenSSL.doccarchive

      - name: Sanity-check archive
        run: |
          test -d ./docs/OpenSSL.doccarchive
          test -f ./docs/OpenSSL.doccarchive/metadata.json || \
            test -f ./docs/OpenSSL.doccarchive/index/index.json

      - name: Zip DocC Archive
        run: |
          cp LICENSE docs/LICENSE
          cd docs && 7z a -tzip -mx=9 OpenSSL.doccarchive.zip OpenSSL.doccarchive LICENSE

      - name: Upload to Release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" docs/OpenSSL.doccarchive.zip

      - name: Write step summary
        run: |
          SIZE=$(ls -lh docs/OpenSSL.doccarchive.zip | awk '{print $5}')
          SHA=$(shasum -a 256 docs/OpenSSL.doccarchive.zip | awk '{print $1}')
          {
            echo "### DocC Release"
            echo ""
            echo "- **Archive**: \`OpenSSL.doccarchive.zip\`"
            echo "- **Size**: $SIZE"
            echo "- **SHA-256**: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
